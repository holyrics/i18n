#It is possible to create items to add to the favorites bar or playlist that execute HTTP requests or send MIDI codes to other devices.\nThis allows you to perform actions on other programs and devices such as OBS Studio, lighting program, PTZ cameras, etc.\nFor example, you can create an item that, when executed, changes a scene in your broadcast program, or an item that selects a preset from a PTZ camera on the network, etc.\nThese actions can be performed by clicking on the item or also performed automatically through the program's <b>Triggers</b> functionality.\nFor example, you can create a trigger so that whenever Holyrics presents the X image in the projection, it automatically changes to the Y scene in your broadcast program.\nOr whenever you present a Bible verse, it automatically switches to the Z scene in your broadcast program.\nThere are many automation possibilities that facilitate and save the work of the multimedia team.
m0372=Można tworzyć elementy do dodania na pasku zakładek lub na liście odtwarzania, które wykonują żądania HTTP lub wysyłają kody MIDI do innych urządzeń.\nPozwala to na wykonywanie działań w innych programach i urządzeniach, takich jak OBS Studio, program oświetleniowy, kamery PTZ itp.\nNa przykład można stworzyć element, który po wykonaniu zmienia scenę w twoim programie transmisyjnym, lub element, który wybiera preset kamery PTZ w sieci itp.\nTe działania można wykonać, klikając na element lub również automatycznie za pomocą funkcji <b>Wyzwalacze</b> programu.\nNa przykład można stworzyć wyzwalacz, aby za każdym razem, gdy Holyrics wyświetla obraz X w projekcji, automatycznie zmieniało się na scenę Y w twoim programie transmisyjnym.\nLub za każdym razem, gdy wyświetlany jest werset z Biblii, automatycznie zmienia się na scenę Z w twoim programie transmisyjnym.\nJest wiele możliwości automatyzacji, które ułatwiają i oszczędzają pracę zespołu multimedialnego.

