#<b>Stage View</b> is a setting that changes the display of slides to a specific monitor.<br>If you have a video output for a public view projection, and you have another video output for someone who is on <b>stage</b>, you can set the <b>return</b> monitor differently than which is being shown to the public.<br>The transmission to the application is also configurable.
m0001=<b>Widok sceny</b> ustawienie, na którym monitorze wyświetlać slajdy.. <br>Jeżeli masz podłączone wyjście na publiczny ekran i masz inne wyjście na <b>scenę</b>, można ustawić <b>obrez</b> wyjścia na monitor na scenie inaczej niż na ekranie publicznym. <br>Transmisja do aplikacji jest również konfigurowalna.

#<b>Checkbox:</b> Set a change in the slide text. E.g: Display the first line of the next slide at the end of the current slide.
m0002=<b>Pole wyboru:</b> Zmień sposób wyświetlania tekstów slajdów. Np: Wyświetla pierwszą linię następnego slajdu na koniec bieżącego slajdu.

#<b>Uppercase:</b> Displays the entire text in upper case.
m0003=<b>DUŻE litery:</b> wyświetla cały tekst w dużymi literami.

#<b>Remove line break:</b> Displays text continuously, breaking line automatically at the limit of the slide and taking up as much side space as possible.
m0004=<b>Usuń znaki końca linii:</b> Wyświetla tekst ciągły, przełamując linię automatycznie na granicy ekranu, wykorzystując jak najwięcej przestrzeni.

#<b>Custom Theme:</b> Changes the slides display theme.
m0005=<b>Własny Motyw:</b> Zmiana motywu wyświetlanego slajdu.

#<b> Enable for Bible:</b> Enables the settings for Bible verses too (except the checkbox setting).
m0006=<b>Włącz dla Biblii:</b> Włącza także ustawienia wersetów biblijnych (z wyjątkiem ustawienia pole wyboru).

#Note: Video themes do not work on stage displays, only on the default monitor.
m0007=Uwaga: Motywy wideo nie działają na wyświetlaczach dla sceny, tylko na domyślnym monitorze.

#You can add a custom edition to a specific paragraph of the lyric. For example, increase <b>proportionally</b> the choir font size.<br>And also put an identification text (chorus, verse, etc ...) that will appear only in the slide footer.
m0008=Można dodać edycję niestandardową do konkretnego akapitu liryki. Na przykład, wzrost <b>proporcjonalny</b> rozmiaru czcionki. <br>Można również umieścić tekst identyfikacyjny (refren, zwrotka, etc ...), który będzie wyświetlany tylko w stopce slajdów.

#View example
m0009=Zobacz przykład

#This feature also works in the Quick Display window
m0010=Funkcja ta działa również w oknie szybkiego wyświetlania

#Available Settings
m0011=Dostępne ustawienia

#All text in uppercase
m0012=Cały tekst wielkimi literami

#putting the character '%' after the number is useless
m0013=umieszczanie znaku '%' po numerze jest bezużyteczne

#text within parentheses = (chorus), (verse), (repeat), (final), ...
m0014=Tekst w nawiasach = (chór), (werset), (repeat) (końcowy), ...

#rgb or hexadecimal value or color name inside brackets = [128,192,64] or [80c040] or [ff0] or [blue]...
m0015=RGB lub wartość szesnastkowa lub nazwę koloru w nawiasach = [128,192,64] lub [80c040] lub [ff0] lub [blue] ...

#Valid names
m0016=Prawidłowe nazwy

#To add a custom formatting, add a line at the beginning of the paragraph starting with two "hashtags" ## and the codes that you want next (the order of the codes does not matter).
m0017=Aby dodać niestandardowe formatowanie, dodaj wiersz na początku akapitu, zaczynając od dwóch „hashtagów” ## i kodów, które chcesz następnie (kolejność kodów nie ma znaczenia).

#In the example, when displaying the lyric for projection, the second paragraph will appear in bold, with the font size 15% larger and in blue color. The other paragraphs will usually appear with Theme settings.
m0018=W tym przykładzie podczas wyświetlania tekstu do projekcji drugi akapit zostanie pogrubiony, a czcionka będzie o 15% większa i będzie miała kolor niebieski. Pozostałe akapity zwykle pojawiają się z ustawieniami motywu.

#Note: If the theme used is already set to bold, for example, this custom formatting will not make any difference.
m0019=Uwaga: jeśli użyty motyw jest już na przykład pogrubiony, to niestandardowe formatowanie nie będzie miało znaczenia.

#Some formatting examples
m0020=Niektóre przykłady formatowania

#Bold and italic
m0021=Pogrubienie i kursywa

#25% bigger
m0022=25% większy

#italic and 5% lower
m0023=kursywą i o 5% mniejsze

#Uppercase and yellow
m0024=Wielkie i żółte

#You can define which lines will have custom formatting applied.<br>  Add two dashes <b>--</b> at the beginning of the line that you do not want to apply the custom formatting.
m0025=Możesz zdefiniować, które linie będą miały niestandardowe formatowanie.<br>Dodaj dwa myślniki <b>--</b> na początku wiersza, jeżeli nie chcesz stosować niestandardowego formatowania.

#In the example, the <b>"Mas ainda é pouco eu sei"</b> line will use the original formatting of the theme, and other lines will use custom formatting (bold and yellow).
m0026=W tym przykładzie linia <b>„Mas ainda é pouco eu sei”</b> użyje oryginalnego formatowania motywu, a inne wiersze użyją niestandardowego formatowania (pogrubienie i żółty).

#You can use the <code>##p</code> code to use <b>standard</b> formatting.<br>All paragraphs defined with <code>##p</code> will use the formatting defined in the field below.
m0027=Możesz użyć kodu <code>##p</code>, aby użyć formatowania <b> standardowego </b>. <br>Wszystkie akapity zdefiniowane za pomocą <code>##p</code> będą używać formatowania zdefiniowanego w polu poniżej.

#Default Custom Formatting
m0028=Domyślnie niestandardowe formatowanie

#Each list represents an internal Holyrics folder: Audio, Video, and Image. To add files: Click the {0} icon of the respective tab to open the folder in Windows and paste the files into the folder. The list in the program is automatically updated with the files in the folder (unless some presentation is active).
m0029=Każda lista reprezentuje wewnętrzny folder Holyrics: Audio, wideo i obraz. Aby dodać pliki: Kliknij ikonę {0} odpowiedniej karty, aby otworzyć folder w systemie Windows i wkleić pliki do folderu. Lista w programie jest automatycznie aktualizowana o pliki w folderze (chyba że aktywna jest jakaś prezentacja).

#<b>Note:</b> AVOID renaming the files in the folder, because if you create a shortcut to a file in a playlist, favorites, etc. and then rename it in the folder, the shortcut in the program will no longer work, you will need to create a new shortcut.
m0030=<b>Uwaga: </b> UNIKAJ zmiany nazw plików w folderze, ponieważ jeśli utworzysz skrót do pliku na liście odtwarzania, ulubionych itp., a następnie zmienisz jego nazwę w folderze, skrót w programie nie będzie już działał, będziesz musiał utworzyć nowy skrót.

#In each folder (Audio, Video and Image), you can add new folders to be a list of files in the program. For example: You can create a folder named <b>Presentation</b> inside the folder <b>Images</b> and add images to it. The folder will be listed has a item in Holyrics interface and clicking on it will open all images for the slide show.
m0031=W każdym folderze (audio, wideo i obraz) można dodawać nowe foldery, które będą listą plików w programie. Na przykład: Możesz utworzyć folder o nazwie <b> Prezentacja </b> w folderze <b> Obrazy </b> i dodać do niego obrazy. Folder zostanie wyświetlony na liście  elementów w interfejsie Holyrics i kliknięcie go otworzy wszystkie obrazy do pokazu slajdów.

#You can add a shortcut to these folders on your desktop by clicking <a href='http://addShortcutDesktop'>HERE</a>.
m0032=Możesz dodać skrót do tych folderów na pulpicie, klikając <a href='http://addShortcutDesktop'> TUTAJ </a>.

#Holyrics Library
m0033=Biblioteka Holyrics 

#Displays the song lyric in uppercase.
m0034=Wyświetla tekst piosenki wielkimi literami.

#Enable/disable the underline in the song title at first slide.
m0035=Włącz/wyłącz podkreślenie w tytule piosenki na pierwszym slajdzie.

#When <b>enabled</b>, the program will break long lines automatically, avoiding to decrease the original size of the font. When <b>disabled</b>, if you have any long lines that extend beyond the side of the slide, the program will decrease the font size until the entire line be inside the slide.
m0036=Po <b>włączeniu</b> program automatycznie przerywa długie linie, unikając zmniejszenia pierwotnego rozmiaru czcionki. Gdy jest <b>wyłączony</b>, jeśli masz jakieś długie linie, które rozciągają się poza bok slajdu, program zmniejszy rozmiar czcionki, aż cała linia znajdzie się w slajdzie.

#Enable/disable the paragraph <a href='http://customFormatting'>custom formatting</a>.
m0037=Włącz/wyłącz <a href='http://customFormatting'> niestandardowe formatowanie </a>.

#Enable/disable <b>Custom Background</b>.
m0038=Włącz/Wyłącz <b>Własne tło</b>.

#The <b>LIVE</b> panel shows what is currently being presented in default display.<br>(Background and video played by VLC Media Player do not appear on the panel.)
m0039=Panel <b> LIVE </b> pokazuje to, co aktualnie jest prezentowane na domyślnym ekranie.<br>(Tło i wideo odtwarzane przez VLC Media Player nie pojawiają się na panelu.)

#If you use a unique return monitor for those on the 'stage', you can use the communication panel to display messages only on this monitor.<br>In the display settings you can set a monitor as <b>stage view</b> (except the main audience monitor), and the messages in the communication panel will be displayed only on monitors set as <b>stage view</b>.
m0040=Jeśli korzystasz z jednego monitora dla osób na „scenie”, możesz użyć panelu komunikacyjnego do wyświetlania komunikatów tylko na tym monitorze.<br>W ustawieniach wyświetlania można ustawić monitor jako <b> widok na scenie </b> (z wyjątkiem głównego monitora publiczności), a komunikaty w panelu komunikacji będą wyświetlane tylko na monitorach ustawionych jako <b> widok na scenie </b>.

#Put the audio to play and click on the slide that you want to be displayed while the song is playing.<br>You can pause and rewind a section of the song to resume from where you stopped.<br>You can also delete an item from the captured list by right-clicking on it.
m0041=Włącz odtwarzanie dźwięku i kliknij slajd, który chcesz wyświetlić podczas odtwarzania utworu.<br>Możesz wstrzymać i przewinąć fragment utworu, aby wznowić odtwarzanie od miejsca, w którym się zatrzymałeś.<br>Możesz także usunąć element z przechwyconej listy, klikając go prawym przyciskiem myszy.

#The slide that will be displayed before the first slide that you click is the one that is defined in the edit window.
m0042=Slajd, który będzie wyświetlany przed pierwszym klikniętym slajdem, jest tym, który jest zdefiniowany w oknie edycji.

#Do not expect to start the song section to click on the specific slide, try to click on the slide a few thousandths of a second before, avoiding delays in the transition between the slides.
m0043=Nie spodziewaj się natychmiastowego wyświetlenia sekcji utworu po kliknięciu w konkretny slajd, spróbuj kliknąć slajd kilka tysięcznych sekundy wcześniej, unikając opóźnień w przejściu między slajdami.

#With the <b>Automatic Presentation</b> you can program the duration of each slide integrated into an MP3 audio (an Instrumental version, for example).<br>Once created, you can choose any theme that you want and start the presentation.<br>The audio will be played by the Media Player and the slides will be automatically displayed while the song is played.
m0044=Dzięki opcji <b> Automatyczna prezentacja </b> możesz zaprogramować czas trwania każdego slajdu zintegrowanego z dźwiękiem MP3 (na przykład wersja instrumentalna).<br>Po utworzeniu możesz wybrać dowolny motyw i rozpocząć prezentację.<br>Audio będzie odtwarzane przez Media Player, a slajdy będą automatycznie wyświetlane podczas odtwarzania utworu.

#<b>Set the initial slide</b> with the <i>Start with</i> option and the <i>duration</i> (in seconds) of the initial slide.
m0045=<b> Ustaw początkowy slajd </b> za pomocą opcji <i> Rozpocznij z </i> i <i> czas trwania </i> (w sekundach) początkowego slajdu.

#<b>Setup the slides</b> right-clicking to add new slides and drag the slides to sort them.
m0046=Kliknij prawym przyciskiem myszy <b>Skonfiguruj slajdy</b>, aby dodać nowe slajdy i przeciągnij slajdy, aby je posortować.

#<b>Set the duration of each slide</b> (in seconds) on the field <i>Duration</i>. You can also change the exact time that the slide starts by clicking on the text that displays the minutes, seconds, and milliseconds.
m0047=<b> Ustaw czas trwania każdego slajdu </b> (w sekundach) w polu <i> Czas trwania </i>. Możesz także zmienić dokładny czas rozpoczęcia slajdu, klikając tekst zawierający minuty, sekundy i milisekundy.

#<b>►</b> play the song from the corresponding slide to the end of the song.
m0048=<b>►</b> odtwarza utwór od odpowiedniego slajdu do końca utworu.

#<b>|►|</b> only plays the section of the corresponding slide.
m0049=<b>|►|</b> odtwarza tylko fragment odpowiedniego slajdu.

#You can use the <i>Capture Method</i> to make it easier to create the order of the slides and the duration of each.
m0050=Możesz użyć <i> Metoda przechwytywania </i>, aby ułatwić ustawianie kolejności slajdów i czasu trwania każdego z nich.

#When saving the <i>Automatic Presentation</i>, the generated <b>[file name].ap</b> file will already include the selected MP3 audio. You do not have to worry about copying the audio along with the <b>(*.ap)</b> file.
m0051=Przy zapisywaniu <i>Automatyczne Presentation</i> wygenerowany <b>[nazwa pliku] .AP</b> plik będzie już zawierać wybraną audio MP3. Nie trzeba się martwić o kopiowanie audio wraz z <b>(*. AP) plik</b>.

#You can edit the text of certain slides while they are displayed.<br>  - Right-clicking on the slide that you want to edit (slide list in the footer of the main window);<br>  - or by pressing <b>SHIFT + F2</b> to edit the currently displayed slide.
m0052=Można edytować tekst niektórych preparatów podczas ich wyświetlania Łódź - prawym przyciskiem myszy na slajdzie, który chcesz edytować (listę slajdów w stopce okna głównego). Łódź - lub naciskając <b>SHIFT + F2</b>, aby edytować aktualnie wyświetlany slajd.

#Chat is a mean of communication between Holyrics Software and the Holyrics mobile app.<br>Any smartphone connected to the network can access the chat through the app and send messages to PC.
m0053=Czat jest średnią komunikacji pomiędzy Holyrics oprogramowania i Holyrics Aplikacja mobilna. Największa Każdy smartfon podłączony do sieci może uzyskać dostęp do czatu za pośrednictwem komunikatów aplikacji i przesłać na PC.

#The selected presentation will run automatically.
m0054=Wybrana prezentacja zostanie uruchomiony automatycznie.

#Click on the message to select.<br>Drag a message to reorder in the list.<br>Enter the highlighted key at the beginning of the message to select the corresponding message. <b>(first image)</b><br>Right-click on the message for more options. <b>(second image)</b>
m0055=Kliknij, aby wybrać wiadomości. <br> Przeciągnij wiadomość, aby zmienić kolejność na liście. <br> Wprowadź klucz podświetlony na początku wiadomości, aby wybrać odpowiedni komunikat. <b>(pierwsze zdjęcie)</b> Największa prawym przyciskiem myszy na wiadomości więcej opcji. <b>(drugi obraz)</b>

#You can change the background or Theme for each paragraph
m0056=Można zmienić tło lub tematu dla każdego akapitu

#by clicking the slide {0} icon
m0057=Klikając ikonę slajd {0}

#dragging an item from themes list to the slide
m0058=przeciągając element z listy tematów do slajdu

#or by right-clicking on the slide for more options
m0059=lub klikając prawym przyciskiem myszy na slajdzie więcej opcji

#<b>Warning!</b> When setting image or video as background, all settings such as font color, alignment, etc. will be kept from the selected song Theme. So be careful when changing the <b>Default Theme</b> of the song, because previously configured images and videos may not match the new theme that you selected.
m0060=<b>Uwaga!</b> Podczas ustawiania obrazu lub wideo jako tło, wszystkie ustawienia, takie jak kolor czcionki, wyrównanie, itp zostaną zachowane z wybraną piosenkę. Dlatego należy zachować ostrożność przy zmianie <b>Domyślny motyw</b> z utworu, bo wcześniej skonfigurowane zdjęcia i filmy mogą nie pasować do nowego tematu, który został wybrany.

#it's a function that allows you to use the software as if you were in extended mode even though you haven't another monitor attached.<br>You can display a small window on your own monitor, simulating what would be displayed in the actual projection.
m0061=jest to funkcja, która pozwala na korzystanie z oprogramowania, jakbyś był w trybie rozszerzonym, nawet jeśli nie mają innego monitora w załączeniu. Największa Można wyświetlić małe okno na własnym monitorze, symulując co będzie wyświetlane w aktualnej projekcji ,

